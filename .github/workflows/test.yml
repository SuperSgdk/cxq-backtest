name: 框架测试与公开文件检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装独立公开版
        run: python -m pip install -e ".[ui,validation]"
      - name: 人工场景与接口测试
        run: python -B run_tests.py
      - name: 检查公开文件
        run: python -B scripts/audit_public.py
      - name: 命令行样例
        run: python -B -m cxq_bt --data examples/market_handcalc.csv --signals examples/signals_handcalc.csv --initial-cash 1000000 --output outputs/ci-handcalc
